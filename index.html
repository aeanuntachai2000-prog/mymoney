<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#167d62"><title>MyMoney</title><style>
:root{--g:#167d62;--bg:#f4f7f6;--ink:#182824;--muted:#7b8984;--line:#e6ece9;--red:#d94d54}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}.app{max-width:680px;margin:auto;padding:20px 16px 35px}.top{display:flex;justify-content:space-between;align-items:center;margin:5px 4px 18px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:800;margin:0 0 5px}h1{font-size:25px;margin:0}h2{font-size:18px;margin:0}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:750;cursor:pointer}.export{background:white;border:1px solid var(--line);color:var(--g);font-size:20px}.balance{background:linear-gradient(135deg,#167d62,#0e5d49);color:white;padding:23px;border-radius:24px;box-shadow:0 12px 30px #167d6222}.balance small{color:#d5eee6}.big{font-size:clamp(30px,8vw,42px);font-weight:800;margin:9px 0 20px;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #ffffff33;padding-top:15px;gap:12px}.stats div{display:grid;gap:7px}.stats strong{font-size:16px}.inc{color:#a9f0cb}.exp{color:#ffc5c5}.section{display:flex;align-items:end;justify-content:space-between;margin:25px 3px 13px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}.actions button{background:white;border:1px solid var(--line);border-radius:14px;padding:13px 3px;color:#53635d;font-weight:700}.actions button.active{border-color:#8ccbb7;background:#f0faf6;color:var(--g)}.card{background:white;border:1px solid var(--line);border-radius:21px;padding:18px;box-shadow:0 10px 30px #183c3008}form{display:grid;gap:10px}label{display:block;color:#596a64;font-size:12px;font-weight:700;margin:5px 0}input,select{width:100%;min-width:0;border:1px solid #e0e8e4;background:#fbfdfc;border-radius:12px;padding:12px;color:var(--ink);font:inherit}input:focus,select:focus{outline:2px solid #b3e0d0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.amount{font-size:24px;font-weight:800}.save{background:var(--g);color:white;padding:15px;margin-top:5px}.list{display:grid;gap:9px}.item{display:flex;gap:11px;align-items:center;background:white;border:1px solid var(--line);border-radius:15px;padding:13px}.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:#edf8f2;color:var(--g);flex-shrink:0}.details{flex:1;min-width:0}.title{font-weight:750;overflow-wrap:anywhere}.meta{font-size:11px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.right{text-align:right;flex-shrink:0;font-weight:800}.right button{display:block;margin-left:auto;border:0;background:none;color:#9aa7a1;font-size:11px;padding:7px 0 0}.empty{text-align:center;background:white;padding:24px;border-radius:15px;color:var(--muted);font-size:13px}.note{background:#edf5f1;padding:13px;border-radius:14px;color:#62756c;font-size:11px;line-height:1.6;margin-top:20px}.note p{margin:0}.message{font-size:12px;color:var(--g);margin:0}footer{text-align:center;color:#a0aaa5;font-size:11px;padding:24px 0 0}@media(max-width:360px){.app{padding:16px 11px}.card{padding:14px}.grid{gap:7px}}
</style></head><body><div class="app"><header class="top"><div><p class="eyebrow">PERSONAL FINANCE</p><h1>MyMoney <span style="color:#167d62;font-size:10px">●</span></h1></div><button class="btn export" id="export" title="ส่งออก CSV">⇧</button></header><section class="balance"><small>ยอดคงเหลือรวม</small><div class="big" id="balance">฿0.00</div><div class="stats"><div><small>รายรับเดือนนี้</small><strong class="inc" id="income">฿0.00</strong></div><div><small>รายจ่ายเดือนนี้</small><strong class="exp" id="expense">฿0.00</strong></div></div></section><div class="section"><div><p class="eyebrow">QUICK ADD</p><h2>เพิ่มรายการ</h2></div></div><div class="actions"><button class="active" data-type="Expense">− รายจ่าย</button><button data-type="Income">＋ รายรับ</button><button data-type="Transfer">⇄ โอนเงิน</button></div><section class="card"><form id="form"><div><label for="amount">จำนวนเงิน (บาท) *</label><input id="amount" class="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></div><div class="grid" id="categoryRow"><div><label for="category">หมวดหมู่</label><select id="category"></select></div><div><label for="account">บัญชี</label><select id="account"><option>เงินสด</option><option>บัญชีธนาคาร</option><option>e-Wallet</option></select></div></div><div id="toRow" hidden><label for="to">โอนไปยังบัญชี</label><select id="to"><option>บัญชีธนาคาร</option><option>เงินสด</option><option>e-Wallet</option></select></div><div><label for="title">ชื่อรายการ *</label><input id="title" maxlength="80" placeholder="เช่น ข้าวกลางวัน" required></div><div class="grid"><div><label for="date">วันที่ *</label><input id="date" type="date" required></div><div><label for="note">หมายเหตุ</label><input id="note" maxlength="160" placeholder="ไม่บังคับ"></div></div><button class="btn save" id="save" type="submit">บันทึกรายจ่าย</button><p class="message" id="message" role="status"></p></form></section><div class="section"><div><p class="eyebrow">HISTORY</p><h2>ประวัติรายการ</h2></div><select id="filter" style="width:auto;max-width:130px;padding:9px;font-size:12px"><option value="All">ทั้งหมด</option><option value="Income">รายรับ</option><option value="Expense">รายจ่าย</option><option value="Transfer">โอนเงิน</option></select></div><div id="list" class="list"></div><div class="note"><p><strong>🔒 ข้อมูลอยู่ในเบราว์เซอร์นี้</strong><br>ยังไม่ซิงก์ข้ามอุปกรณ์ กรุณาส่งออก CSV เป็นระยะเพื่อสำรองข้อมูล</p></div><footer>MyMoney · เวอร์ชันทดลอง</footer></div><script>
const $=id=>document.getElementById(id);let type='Expense';const cats={Expense:['อาหาร','เดินทาง','ที่พัก','บิล/ค่าน้ำไฟ','ช้อปปิ้ง','สุขภาพ','หนี้สิน','บันเทิง','อื่น ๆ'],Income:['เงินเดือน','OT','รายได้เสริม','ดอกเบี้ย','รายรับอื่น ๆ']};const key='mymoney_transactions_v1';let tx=[];try{tx=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}const now=new Date();$('date').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;const money=n=>new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB'}).format(n||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function setType(t){type=t;document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===t));$('categoryRow').hidden=t==='Transfer';$('toRow').hidden=t!=='Transfer';$('category').innerHTML=(cats[t]||[]).map(c=>`<option>${esc(c)}</option>`).join('');$('save').textContent=t==='Expense'?'บันทึกรายจ่าย':t==='Income'?'บันทึกรายรับ':'บันทึกการโอน'}document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>setType(b.dataset.type));function persist(){localStorage.setItem(key,JSON.stringify(tx));render()}function render(){const month=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;let balance=0,inc=0,exp=0;tx.forEach(t=>{if(t.type==='Income')balance+=t.amount;if(t.type==='Expense')balance-=t.amount;if(t.date.startsWith(month)){if(t.type==='Income')inc+=t.amount;if(t.type==='Expense')exp+=t.amount}});$('balance').textContent=money(balance);$('income').textContent=money(inc);$('expense').textContent=money(exp);const f=$('filter').value;const arr=tx.filter(t=>f==='All'||t.type===f).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);$('list').innerHTML=arr.length?arr.map(t=>{const sign=t.type==='Income'?'+':t.type==='Expense'?'−':'';const color=t.type==='Income'?'#1b9b63':t.type==='Expense'?'#d94d54':'#4777d5';const icon=t.type==='Income'?'＋':t.type==='Expense'?'−':'⇄';const meta=t.type==='Transfer'?`${esc(t.account)} → ${esc(t.to)}`:`${esc(t.category)} · ${esc(t.account)}`;return `<article class="item"><div class="ico">${icon}</div><div class="details"><div class="title">${esc(t.title)}</div><div class="meta">${meta} · ${esc(t.date)}${t.note?' · '+esc(t.note):''}</div></div><div class="right" style="color:${color}">${sign}${money(t.amount)}<button data-del="${t.id}">ลบ</button></div></article>`}).join(''):'<div class="empty">ยังไม่มีรายการ<br>เริ่มบันทึกรายการแรกได้เลยค่ะ</div>'} $('form').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('amount').value);if(!(amount>0))return;if(type==='Transfer'&&$('account').value===$('to').value){$('message').textContent='บัญชีต้นทางและปลายทางต้องต่างกัน';return}tx.push({id:Date.now(),type,amount,date:$('date').value,title:$('title').value.trim(),note:$('note').value.trim(),category:type==='Transfer'?'โอนเงิน':$('category').value,account:$('account').value,to:type==='Transfer'?$('to').value:'',createdAt:new Date().toISOString()});persist();$('amount').value='';$('title').value='';$('note').value='';$('message').textContent='บันทึกเรียบร้อยแล้ว'});$('list').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(b&&confirm('ต้องการลบรายการนี้ใช่ไหมคะ?')){tx=tx.filter(t=>t.id!==Number(b.dataset.del));persist()}});$('filter').onchange=render;$('export').onclick=()=>{const rows=[['วันที่','ประเภท','จำนวนเงิน','หมวดหมู่','บัญชี','บัญชีปลายทาง','ชื่อรายการ','หมายเหตุ'],...tx.map(t=>[t.date,t.type,t.amount,t.category,t.account,t.to,t.title,t.note])];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='MyMoney_backup.csv';a.click();URL.revokeObjectURL(url)};setType('Expense');render();
</script></body></html>
